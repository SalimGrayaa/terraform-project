name: AWS K8s Lab - Deploy Application

on:
  workflow_call:
    inputs:
      bucket_name:
        description: 'S3 Bucket Name'
        required: true
        type: string
      region:
        description: 'AWS Region'
        required: false
        default: 'us-east-1'
        type: string

env:
  AWS_REGION: ${{ inputs.region || 'us-east-1' }}

concurrency:
  group: terraform-deploy-${{ inputs.bucket_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy_application:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./application
    env:
      TF_VAR_region: ${{ inputs.region || 'us-east-1' }}
      TF_VAR_bucket_name: ${{ inputs.bucket_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Run Common Project Initialization
        uses: ./.github/actions/x-common-steps
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.region || 'us-east-1' }}
          terraform-version: latest

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: |
          terraform init -backend=false
          terraform validate
          terraform init \
            -backend-config="bucket=${{ inputs.bucket_name }}" \
            -backend-config="key=terraform.tfstate" \
            -backend-config="region=${{ inputs.region || 'us-east-1' }}"

      - name: Terraform Plan
        run: terraform plan -out=tfplan -var="region=${{ inputs.region || 'us-east-1' }}" -var="bucket_name=${{ inputs.bucket_name }}"

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
      
      - name: Setup Control Plane Instance
        run: |
          private_dns=$(terraform output -raw k8s_control_plane_instance_hostname)
          control_plane_public_ip=$(terraform output -raw k8s_control_plane_instance_public_ip)
          key_path=$(terraform output -raw key_path)

          echo "Waiting for SSH on ${control_plane_public_ip} (timeout 5m)"
          timeout=300
          interval=10
          elapsed=0
          until ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=5 -i "$key_path" ubuntu@${control_plane_public_ip} 'echo ssh-ok' &>/dev/null; do
            if [ "$elapsed" -ge "$timeout" ]; then
              echo "Timed out waiting for SSH on ${control_plane_public_ip}" >&2
              exit 1
            fi
            sleep $interval
            elapsed=$((elapsed + interval))
            echo "Retrying SSH... elapsed ${elapsed}s"
          done

          scp -o StrictHostKeyChecking=no -i "$key_path" scripts/setup_cp.sh ubuntu@${control_plane_public_ip}:/home/ubuntu/setup_k8s_control_plane.sh
          ssh -o StrictHostKeyChecking=no -i "$key_path" ubuntu@${control_plane_public_ip} \
            "sudo /bin/bash /home/ubuntu/setup_k8s_control_plane.sh '${private_dns}' && sudo rm -f /home/ubuntu/setup_k8s_control_plane.sh"

      - name: Join Kubernetes Workers
        run: |
          control_plane_public_ip=$(terraform output -raw k8s_control_plane_instance_public_ip)
          worker_1_public_ip=$(terraform output -raw k8s_worker_1_instance_public_ip)
          worker_2_public_ip=$(terraform output -raw k8s_worker_2_instance_public_ip)
          key_path=$(terraform output -raw key_path)
          join_command=$(ssh -o BatchMode=yes -o StrictHostKeyChecking=no -i "$key_path" ubuntu@${control_plane_public_ip} \
            'sudo kubeadm token create --print-join-command')

          for worker_public_ip in "$worker_1_public_ip" "$worker_2_public_ip"; do
            echo "Waiting for SSH on ${worker_public_ip} (timeout 5m)"
            timeout=300
            interval=10
            elapsed=0
            until ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=5 -i "$key_path" ubuntu@${worker_public_ip} 'echo ssh-ok' &>/dev/null; do
              if [ "$elapsed" -ge "$timeout" ]; then
                echo "Timed out waiting for SSH on ${worker_public_ip}" >&2
                exit 1
              fi
              sleep $interval
              elapsed=$((elapsed + interval))
            done

            ssh -o StrictHostKeyChecking=no -i "$key_path" ubuntu@${worker_public_ip} "sudo ${join_command}"
          done
      - name: deploy nginx server
        run: |
          control_plane_public_ip=$(terraform output -raw k8s_control_plane_instance_public_ip)
          key_path=$(terraform output -raw key_path)

          echo "Waiting for SSH on ${control_plane_public_ip} (timeout 5m)"
          timeout=300
          interval=10
          elapsed=0
          until ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=5 -i "$key_path" ubuntu@${control_plane_public_ip} 'echo ssh-ok' &>/dev/null; do
            if [ "$elapsed" -ge "$timeout" ]; then
              echo "Timed out waiting for SSH on ${control_plane_public_ip}" >&2
              exit 1
            fi
            sleep $interval
            elapsed=$((elapsed + interval))
            echo "Retrying SSH... elapsed ${elapsed}s"
          done

          scp -o StrictHostKeyChecking=no -i "$key_path" nginx-k8s/deployment.yaml ubuntu@${control_plane_public_ip}:/home/ubuntu/deployment.yaml
          ssh -o StrictHostKeyChecking=no -i "$key_path" ubuntu@${control_plane_public_ip} \
            "sudo kubectl apply -f deployment.yaml"

          ssh -o StrictHostKeyChecking=no -i "$key_path" ubuntu@${control_plane_public_ip} \
            "sudo kubectl rollout status deployment/simple-web-app --timeout=180s"

          nginx_load_balancer_dns_name=$(terraform output -raw nginx_load_balancer_dns_name)
          echo "Waiting for nginx at ${nginx_load_balancer_dns_name} (timeout 5m)"
          curl --fail --retry 30 --retry-delay 10 --retry-connrefused \
            "http://${nginx_load_balancer_dns_name}:80"

      - name: Destroy Terraform Resources on Failure
        if: ${{ failure() }}
        run: terraform destroy -auto-approve -var="region=${{ inputs.region || 'us-east-1' }}" -var="bucket_name=${{ inputs.bucket_name }}"