name: AWS K8s Lab - Bootstrap

on:
  workflow_call:
    inputs:
      bucket_name:
        description: 'S3 Bucket Name'
        required: true
        type: string
      region:
        description: 'AWS Region'
        required: false
        default: 'us-east-1'
        type: string


concurrency:
  group: terraform-bootstrap-${{ inputs.bucket_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Run Common Project Initialization
        uses: ./.github/actions/x-common-steps
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.region || 'us-east-1' }}
          terraform-version: latest

      - name: Create S3 Bucket with AWS CLI with enabled versioning
        run: |
          if aws s3api head-bucket --bucket "${{ inputs.bucket_name }}" --region "${{ inputs.region || 'us-east-1' }}" 2>/dev/null; then
            echo "Bucket already exists. Continuing."
          else
            aws s3api create-bucket --bucket "${{ inputs.bucket_name }}" --region "${{ inputs.region || 'us-east-1' }}"
          fi
          aws s3api put-bucket-versioning --bucket "${{ inputs.bucket_name }}" --versioning-configuration Status=Enabled

      - name: Verify S3 Bucket Creation
        run: |
          aws s3api list-buckets --query "Buckets[?Name=='${{ inputs.bucket_name }}'].Name" --output text || { echo "Bucket does not exist"; exit 1; }
          echo "Bucket ${{ inputs.bucket_name }} created successfully in region ${{ inputs.region || 'us-east-1' }}."
